# Nubo - Nginx (sirve React SPA + proxy /api -> backend + WebSocket /ws)
# SSL terminado aqui con certificados de Let's Encrypt (montados desde el host).

# HTTP -> HTTPS redirect + ruta de validacion ACME (certbot webroot)
server {
    listen 80;
    server_name noboexpress.com www.noboexpress.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name noboexpress.com www.noboexpress.com;

    ssl_certificate     /etc/letsencrypt/live/noboexpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noboexpress.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    # --- API backend (FastAPI) ---
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- WebSocket de tracking en tiempo real ---
    location /ws/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # --- React SPA (rutas del cliente) ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estaticos
    location /static/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
