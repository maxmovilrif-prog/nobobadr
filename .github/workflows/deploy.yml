name: Deploy Nubo to DigitalOcean

# Despliegue continuo: cada push a main actualiza el VPS automaticamente.
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite lanzarlo a mano desde la pestana Actions

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy on Droplet
    runs-on: ubuntu-latest
    steps:
      - name: Connect via SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}          # IP del Droplet
          username: ${{ secrets.DO_USER }}      # normalmente: root
          key: ${{ secrets.DO_SSH_KEY }}        # clave privada SSH
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/nubo
            echo "==> Pulling latest code..."
            git fetch --all
            git reset --hard origin/main
            echo "==> Rebuilding & restarting containers..."
            docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
            echo "==> Pruning old images..."
            docker image prune -f
            echo "==> Health check..."
            sleep 8
            curl -fsS https://noboexpress.com/api/public/cities > /dev/null \
              && echo "✅ Backend OK" \
              || (echo "❌ Backend health check FAILED"; docker compose -f deploy/docker-compose.yml logs --tail=80 backend; exit 1)
